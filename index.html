<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#101828;--mut:#5b6678;--ac:#0f766e;--acs:#d5efec;--br:#d5dce6}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.lvl{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(30px,7vw,46px);line-height:1.1;margin:28px 0 12px}
h2{font-size:22px;line-height:1.3;margin:14px 0}
.lead,.mut{color:var(--mut)}
.lead{max-width:58ch;margin:0 0 24px}
.grid{display:grid;gap:12px}
button{font:inherit;color:inherit}
.card{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:18px;background:var(--card);border:1.5px solid var(--br);border-radius:14px;cursor:pointer}
.card:hover,.opt:hover{border-color:var(--ac)}
.card b{font-size:20px;display:block}
.fl{font-size:38px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ghost{background:none;border:0;color:var(--mut);cursor:pointer;padding:8px 4px}
.bar{height:6px;background:var(--br);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.sec{margin:14px 0 0;color:var(--mut);font-size:14px}
blockquote{margin:12px 0;padding:14px 16px;background:var(--card);border-left:4px solid var(--ac);border-radius:6px;font-family:Georgia,serif}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{padding:14px 16px;text-align:left;background:var(--card);border:1.5px solid var(--br);border-radius:12px;cursor:pointer}
.skip{color:var(--mut);background:none;border-style:dashed}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0}
textarea{width:100%;padding:12px;border:1.5px solid var(--br);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.res{background:var(--card);border:1.5px solid var(--br);border-radius:16px;padding:22px;margin-top:14px}
.lvl{font-size:76px;line-height:1;color:var(--ac)}
.row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.row .bar{height:10px}
.ex{background:var(--acs);padding:10px 14px;border-radius:10px;margin:8px 0}
.note{font-size:13px;color:var(--mut);margin-top:14px}
</style></head>

var T="GGGGLGGGRGGGLGRGGG".split(""),N=T.length;

function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function rnd(s){var a=s.split("|");return a[Math.floor(Math.random()*a.length)]}
function mk(t,l,s){var p=s.split("|"),x={t:t,l:l},o;
if(t=="G"){x.s=p[0];o=p.slice(1)}else{x.p=p[0];x.s=p[1];o=p.slice(2)}
x.c=o[0];x.o=shuf(o.slice());return x}

/* Адаптивная оценка (модель IRT, 3PL с фиксированными параметрами):
   сложность вопроса = уровень CEFR, способность считается по всем ответам. */
function est(h){var W=[],z=0,m=0,v=0;
GR.forEach(function(t){var lg=-t*t/6.5;
h.forEach(function(x){var p=.3+.7/(1+Math.exp(-1.2*(t-x.l+2.5)));lg+=Math.log(x.ok?p:1-p)});
var w=Math.exp(lg);W.push(w);z+=w;m+=t*w});
m/=z;GR.forEach(function(t,i){v+=(t-m)*(t-m)*W[i]});return[m,Math.sqrt(v/z)]}

function home(){S=null;window.scrollTo(0,0);speechSynthesis&&speechSynthesis.cancel();
app.innerHTML='<h1>Какой у вас уровень языка?</h1><p class="lead">Адаптивный тест, как в современных онлайн-экзаменах: каждый ответ меняет сложность следующего вопроса, а уровень считается по всем ответам сразу. Проверяются грамматика, лексика, чтение, аудирование, письмо и говорение. Каждый раз вопросы подбираются заново.</p><div class="grid">'+
Object.keys(D).map(function(k){var d=D[k];return '<button class="card" onclick="start(\''+k+'\')"><span class="fl">'+d.f+'</span><span><b>'+d.o+'</b><span class="mut">'+N+' адаптивных вопросов, письмо и говорение</span></span></button>'}).join("")+'</div>'}

function start(k){var d=D[k],pool=[];
d.G.forEach(function(a,l){a.forEach(function(s){pool.push(mk("G",l,s))})});
["L","R"].forEach(function(t){d[t].forEach(function(s){pool.push(mk(t,+s[0],s.slice(2)))})});

function nx(){var t=T[S.h.length],c=S.pool.filter(function(x){return x.t==t&&!x.u});

speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=D[S.k].v;u.rate=.9;speechSynthesis.speak(u)}

function render(){window.scrollTo(0,0);var d=D[S.k],n=S.h.length,h;
h='<div class="top"><button class="ghost" onclick="home()">← Каталог</button><span>'+d.f+' '+d.o+'</span></div><div class="bar"><i style="width:'+((n+S.wd)/(N+2)*100)+'%"></i></div>';
if(n<N){if(!S.cur)nx();var x=S.cur,nm={G:"Грамматика и лексика",L:"Аудирование",R:"Чтение"}[x.t];
h+='<p class="sec">'+nm+', вопрос '+(n+1)+' из '+N+'</p>';
if(x.t=="R")h+='<blockquote>'+x.p+'</blockquote>';
if(x.t=="L")h+='<button class="btn" onclick="say(S.cur.p)">🔊 Прослушать</button><span class="mut">Можно повторить. Текст скрыт.</span>';
h+='<h2>'+x.s+'</h2><div class="opts">'+x.o.map(function(o,j){return '<button class="opt" onclick="pick('+j+')">'+o+'</button>'}).join("")+'<button class="opt skip" onclick="pick(-1)">Не знаю</button></div>'}
else if(!S.wd){h+='<p class="sec">Письмо</p><h2>'+S.wt+'</h2><p class="mut">Напишите 5–8 предложений на изучаемом языке.</p><textarea id="tx" rows="7" oninput="cnt()"></textarea><p id="wc" class="mut">0 слов</p><button class="btn" onclick="nw(0)">Далее</button><button class="ghost" onclick="nw(1)">Пропустить</button>'}

function pick(j){var x=S.cur;S.h.push({t:x.t,l:x.l,ok:x.o[j]===x.c?1:0});var e=est(S.h);S.th=e[0];S.sd=e[1];S.cur=null;render()}

function nrm(s){return s.toLowerCase().replace(/[^\p{L}\s]/gu,"").split(/\s+/).filter(Boolean)}

r.start()}

function wIdx(t){var w=nrm(t),n=w.length;if(n<15)return null;
